services:
  - type: web
    name: cropguard-ai-api
    runtime: python
    plan: free   # ✅ this is the correct way to set free plan
    buildCommand: |
      cd cropguard_ai
      pip install -r requirements.txt
    startCommand: |
      cd cropguard_ai
      uvicorn api.index:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
