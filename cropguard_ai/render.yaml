services:
  - type: web
    name: cropguard-ai
    runtime: python
    plan: free

    buildCommand: |
      pip install -r requirements.txt
      cd cropguard_ai/frontend
      npm install
      npm run build

    startCommand: uvicorn api.index:app --host 0.0.0.0 --port 10000

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
