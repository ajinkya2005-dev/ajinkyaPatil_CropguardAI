services:
  # ==============================
  # 🔵 FASTAPI BACKEND SERVICE
  # ==============================
  - type: web
    name: cropguard-api
    env: python
    rootDir: cropguard_ai
    buildCommand: |
      pip install -r requirements.txt
    startCommand: |
      uvicorn api.index:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  # ==============================
  # 🟢 REACT FRONTEND STATIC SITE
  # ==============================
  - type: web
    name: cropguard-frontend
    env: static
    rootDir: cropguard_ai/frontend
    buildCommand: |
      npm install
      npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://cropguard-api.onrender.com
